# PostgreSQL configuration.
#
# Credentials come from the environment so that the same file works for local
# development, CI and production. Defaults target a local socket connection.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", nil) %>
  host: <%= ENV.fetch("DATABASE_HOST", "/var/run/postgresql") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: codequest_development

test:
  <<: *default
  database: codequest_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "codequest_production") %>
  url: <%= ENV.fetch("DATABASE_URL", nil) %>
